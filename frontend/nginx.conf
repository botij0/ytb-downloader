# Serve the Vite build as a single-page app and proxy API calls to the
# backend. The browser therefore always talks to the same origin (the
# frontend's host and port), regardless of the machine's IP or hostname.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve the backend service through Docker's embedded DNS so nginx keeps
    # working if the backend container is recreated with a different IP.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Metadata lookups and media downloads can take a while.
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Stream downloads instead of buffering them to disk.
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets with content hashes can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
