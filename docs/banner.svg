<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="lamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d99a2b"/>
      <stop offset="1" stop-color="#c0871f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a18"/>
      <stop offset="1" stop-color="#101413"/>
    </linearGradient>
  </defs>

  <!-- chassis -->
  <rect width="1280" height="320" rx="16" fill="#191d1b"/>

  <!-- brushed faceplate -->
  <rect x="16" y="16" width="1248" height="288" rx="10" fill="#f1f2ed"/>
  <g stroke="#191d1b" stroke-width="1" opacity="0.04">
    <line x1="24" y1="48" x2="1256" y2="48"/>
    <line x1="24" y1="72" x2="1256" y2="72"/>
    <line x1="24" y1="96" x2="1256" y2="96"/>
    <line x1="24" y1="120" x2="1256" y2="120"/>
    <line x1="24" y1="144" x2="1256" y2="144"/>
    <line x1="24" y1="168" x2="1256" y2="168"/>
    <line x1="24" y1="192" x2="1256" y2="192"/>
    <line x1="24" y1="216" x2="1256" y2="216"/>
    <line x1="24" y1="240" x2="1256" y2="240"/>
    <line x1="24" y1="264" x2="1256" y2="264"/>
    <line x1="24" y1="288" x2="1256" y2="288"/>
  </g>

  <!-- rack screws -->
  <g>
    <circle cx="44" cy="44" r="9" fill="#191d1b"/>
    <line x1="39" y1="39" x2="49" y2="49" stroke="#5a625c" stroke-width="2"/>
    <circle cx="1236" cy="44" r="9" fill="#191d1b"/>
    <line x1="1231" y1="49" x2="1241" y2="39" stroke="#5a625c" stroke-width="2"/>
    <circle cx="44" cy="276" r="9" fill="#191d1b"/>
    <line x1="39" y1="271" x2="49" y2="281" stroke="#5a625c" stroke-width="2"/>
    <circle cx="1236" cy="276" r="9" fill="#191d1b"/>
    <line x1="1231" y1="281" x2="1241" y2="271" stroke="#5a625c" stroke-width="2"/>
  </g>

  <!-- model print -->
  <text x="1216" y="42" text-anchor="end" font-family="'Noto Sans Mono', monospace" font-size="13" letter-spacing="2" fill="#5a625c">MDL YTB-1U</text>

  <!-- brand tile (favicon, 2x) -->
  <g transform="translate(64,96) scale(2)">
    <rect width="64" height="64" rx="14" fill="#191d1b"/>
    <rect x="5" y="5" width="54" height="54" rx="10" fill="#101413"/>
    <rect x="5.5" y="5.5" width="53" height="53" rx="9.5" fill="none" stroke="#2b302d"/>
    <g fill="url(#lamp)" stroke="url(#lamp)" stroke-width="2" stroke-linejoin="round">
      <path d="M28 15 H36 V26 H45 L32 45 L19 26 H28 Z"/>
      <rect x="20" y="50" width="24" height="5" rx="2.5" stroke="none"/>
    </g>
  </g>

  <!-- nameplate -->
  <text x="224" y="172" font-family="'Noto Serif', serif" font-weight="bold" font-size="62" letter-spacing="-1" fill="#191d1b">ytb-downloader</text>

  <!-- pilot lamp + spec line -->
  <circle cx="233" cy="211" r="9" fill="#c0871f" opacity="0.25"/>
  <circle cx="233" cy="211" r="5" fill="#c0871f"/>
  <line x1="252" y1="206" x2="690" y2="206" stroke="#5a625c" stroke-width="1" opacity="0.5"/>
  <text x="252" y="232" font-family="'Noto Sans Mono', monospace" font-size="16" letter-spacing="3" fill="#5a625c">PASTE · PREVIEW · PICK · DOWNLOAD</text>

  <!-- dial glass readout -->
  <rect x="776" y="56" width="440" height="208" rx="12" fill="url(#glass)"/>
  <rect x="776.5" y="56.5" width="439" height="207" rx="11.5" fill="none" stroke="#2b302d"/>

  <text x="812" y="104" font-family="'Noto Sans Mono', monospace" font-size="16" letter-spacing="1" fill="#9aa39d">JOB 7F3A · 1080P · MP4</text>
  <text x="812" y="148" font-family="'Noto Sans Mono', monospace" font-weight="bold" font-size="26" letter-spacing="1" fill="#d99a2b">DOWNLOADING 72%</text>

  <text x="812" y="184" font-family="'Noto Sans Mono', monospace" font-size="12" letter-spacing="4" fill="#5a625c">PROGRESS</text>

  <!-- VU meter: 15 cells, 11 lit -->
  <g>
    <rect x="812"  y="196" width="18" height="34" rx="3" fill="url(#lamp)"/>
    <rect x="837"  y="196" width="18" height="34" rx="3" fill="url(#lamp)"/>
    <rect x="862"  y="196" width="18" height="34" rx="3" fill="url(#lamp)"/>
    <rect x="887"  y="196" width="18" height="34" rx="3" fill="url(#lamp)"/>
    <rect x="912"  y="196" width="18" height="34" rx="3" fill="url(#lamp)"/>
    <rect x="937"  y="196" width="18" height="34" rx="3" fill="url(#lamp)"/>
    <rect x="962"  y="196" width="18" height="34" rx="3" fill="url(#lamp)"/>
    <rect x="987"  y="196" width="18" height="34" rx="3" fill="url(#lamp)"/>
    <rect x="1012" y="196" width="18" height="34" rx="3" fill="url(#lamp)"/>
    <rect x="1037" y="196" width="18" height="34" rx="3" fill="url(#lamp)"/>
    <rect x="1062" y="196" width="18" height="34" rx="3" fill="#e0735a"/>
    <rect x="1087" y="196" width="18" height="34" rx="3" fill="#1c2220"/>
    <rect x="1112" y="196" width="18" height="34" rx="3" fill="#1c2220"/>
    <rect x="1137" y="196" width="18" height="34" rx="3" fill="#1c2220"/>
    <rect x="1162" y="196" width="18" height="34" rx="3" fill="#1c2220"/>
  </g>
</svg>
