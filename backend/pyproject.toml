[project]
name = "ytb-downloader-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2026.8.19",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.5",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"app/jobs.py" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
