services:
  backend:
    build: ./backend
    ports:
      # Host port is configurable; the container always listens on 8000.
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      YTB_DOWNLOAD_DIR: /data/downloads
      # Allow the containerized frontend origin (plus local dev origins).
      # The frontend origin follows FRONTEND_PORT unless CORS_ORIGINS is set.
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-8080},http://127.0.0.1:${FRONTEND_PORT:-8080},http://localhost:5173,http://127.0.0.1:5173}"
    volumes:
      - downloads:/data/downloads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at build time: the URL browsers use to reach the API.
        # Follows BACKEND_PORT unless VITE_API_BASE is set.
        VITE_API_BASE: "${VITE_API_BASE:-http://localhost:${BACKEND_PORT:-8000}}"
    ports:
      # Host port is configurable; nginx always listens on 80.
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  downloads:
